<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CMS Admin</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // 1. Register your Layout CSS
    // Point to the actual file location in your src folder
    CMS.registerPreviewStyle("/src/app.css");

    // 2. Define the Preview Component for the Widget
    var HtmlPreview = createClass({
      render: function() {
        // For a widget preview, the value is passed directly as this.props.value
        var htmlContent = this.props.value || "";
        
        return h('div', {
          className: 'user-html-content',
          dangerouslySetInnerHTML: { __html: htmlContent }
        });
      }
    });

    // 3. Register the new Widget
    // We reuse the 'text' widget for the control (input) to avoid CodeMirror configuration errors
    var SimpleTextControl = CMS.getWidget('text').control;
    CMS.registerWidget('html', SimpleTextControl, HtmlPreview);
  </script>
</body>
</html>
